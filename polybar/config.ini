[colors]
background = #879965
background-alt = #91A477
foreground = #263321
foreground-dim = #526347
accent = #F2F5E9
accent-alt = #3d4e29
border = #71845B
urgent = #A64B45

[bar/main]
monitor = ${env:MONITOR:}
width = 99%
height = 32
offset-x = 0.5%
offset-y = 8
fixed-center = true
bottom = false
enable-ipc = true

background = ${colors.background}
foreground = ${colors.foreground}
; border
border-size = 0
border-bottom-size = 3
border-bottom-color = ${colors.border}
; padding and all
padding-left = 1
padding-right = 1
module-margin = 1

radius = 0
line-size = 2
line-color = ${colors.border}

; font
font-0 = JetBrainsMono Nerd Font:style=Medium:size=10;2
font-1 = JetBrainsMono Nerd Font:size=12;2
font-2 = Noto Sans:size=10;2
font-3 = JetBrainsMono Nerd Font:style=Medium:size=14;2

modules-left = bspwm
modules-center = date
modules-right = pulseaudio battery network

separator = " "
separator-foreground = ${colors.foreground-dim}

cursor-click = pointer
cursor-scroll = ns-resize

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = true
enable-click = true
enable-scroll = false
reverse-scroll = false
fuzzy-match = true

; cute balls stuff
label-focused = ●
label-focused-foreground = ${colors.accent}
label-focused-padding = 1

label-occupied = ●
label-occupied-foreground = ${colors.accent-alt}
label-occupied-padding = 1

label-empty = ○
label-empty-foreground = ${colors.foreground-dim}
label-empty-padding = 1

label-urgent = ●
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a %b %d, %I:%M %p
date-alt = %A, %B %d • %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}
label-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = %{T4}<ramp-volume>%{T-}
format-volume-foreground = ${colors.accent}
format-volume-padding = 1

format-muted = %{T4}<label-muted>%{T-}
format-muted-foreground = ${colors.foreground-dim}
format-muted-padding = 1

label-muted = 󰝟
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

[module/battery]
type = internal/battery

; Change these if your battery/AC names differ
battery = BAT0
adapter = ADP0

full-at = 98
poll-interval = 5
time-format = %H:%M

format-charging = %{T4}<animation-charging>%{T-} <label-charging>
format-discharging = %{T4}<ramp-capacity>%{T-} <label-discharging>
format-full = %{T4}<ramp-capacity>%{T-} <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = FULL

format-charging-foreground = ${colors.accent}
format-discharging-foreground = ${colors.accent}
format-full-foreground = ${colors.accent}

format-charging-padding = 1
format-discharging-padding = 1
format-full-padding = 1

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰂉
animation-charging-framerate = 750

[module/network]
type = internal/network
interface = ${env:WIFI_INTERFACE:wlan0}
interval = 3
ping-interval = 10

format-connected = %{T4}<ramp-signal>%{T-}
format-connected-foreground = ${colors.accent}
format-connected-padding = 1

format-disconnected = %{T4}<label-disconnected>%{T-}
format-disconnected-foreground = ${colors.foreground-dim}
format-disconnected-padding = 1

label-disconnected = 󰤭
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = ${colors.accent}