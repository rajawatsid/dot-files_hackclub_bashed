
conky.config = {
    alignment = 'top_right',
    gap_x = 25,
    gap_y = 100,

    minimum_width = 290,
    maximum_width = 290,
    minimum_height = 0,

    background = false,
    border_width = 0,
    border_inner_margin = 15,
    border_outer_margin = 0,
    draw_borders = false,
    draw_outline = false,
    draw_shades = false,

    double_buffer = true,

    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 120,
    own_window_colour = '1a1f14',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=10',

    xftalpha = 1,
    update_interval = 1,

    uppercase = false,
    use_spacer = 'none',

    default_color = 'F2F5E9',
    color1 = '91A477',
    color2 = '71845B',
    color3 = '879965',
};

conky.text = [[
${alignc}${color1}${font JetBrainsMono Nerd Font:bold:size=19}${time %H:%M}${font}
${alignc}${color3}${time %A, %d %B %Y}

${voffset 5}${color2}${hr 2}
${voffset 5}${color1}${font JetBrainsMono Nerd Font:bold:size=11}SYSTEM INFO${font}
${voffset 5}${color3}HOSTNAME ${alignr}${color}${nodename}
${color3}KERNEL   ${alignr}${color}${kernel}
${color3}UPTIME   ${alignr}${color}${uptime}

${voffset 8}${color2}${hr 1}
${voffset 5}${color1}${font JetBrainsMono Nerd Font:bold:size=11}PROCESSOR${font}
${color3}CPU USAGE ${alignr}${color}${cpu}%
${color2}${cpubar 6,270}
${color3}CORE 1 ${alignr}${color}${cpu cpu1}%
${color3}CORE 2 ${alignr}${color}${cpu cpu2}%

${voffset 8}${color2}${hr 1}
${voffset 5}${color1}${font JetBrainsMono Nerd Font:bold:size=11}MEMORY${font}
${color3}RAM ${alignr}${color}${mem} / ${memmax}
${color2}${membar 6,270}
${color3}SWAP ${alignr}${color}${swap} / ${swapmax}

${voffset 8}${color2}${hr 1}
${voffset 5}${color1}${font JetBrainsMono Nerd Font:bold:size=11}STORAGE${font}
${color3}ROOT ${alignr}${color}${fs_used /} / ${fs_size /}
${color2}${fs_bar 6,270 /}

${voffset 10}${color2}${hr 2}
${alignc}${color1}${font JetBrainsMono Nerd Font:bold:size=11}hello, ${execi 60 whoami}${font}
]];
