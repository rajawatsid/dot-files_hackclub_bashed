
# widow
background            #263321
foreground            #F2F5E9
selection_background  #71845B
selection_foreground  #F2F5E9
cursor                #91A477
cursor_text_color     #263321

# appa-city
background_opacity    0.92



window_padding_width  12



active_border_color   #91A477
inactive_border_color #526347
bell_border_color     #A64B45


active_tab_background   #71845B
active_tab_foreground   #F2F5E9
inactive_tab_background #263321
inactive_tab_foreground #879965
tab_bar_background      #263321


color0  #263321
color1  #A64B45
color2  #91A477
color3  #D4B978
color4  #71845B
color5  #A58B9D
color6  #8FAFA0
color7  #D4DFC7

color8  #738369
color9  #D4776C
color10 #A8BD8E
color11 #E8D19A
color12 #879965
color13 #C3A9B9
color14 #A9C9B5
color15 #F2F5E9

# font stuff
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0

disable_ligatures never


remember_window_size yes
initial_window_width 110c
initial_window_height 32c

hide_window_decorations yes
draw_minimal_borders yes
window_border_width 1.5pt

cursor_shape block
cursor_blink_interval 0

scrollback_lines 10000
scrollback_pager_history_size 10000

url_style curly
copy_on_select yes

# keyboard shortcuts

map ctrl+t new_tab
map ctrl+w close_tab
map ctrl+h previous_tab
map ctrl+l next_tab

# window split
map ctrl+shift+enter new_window
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right