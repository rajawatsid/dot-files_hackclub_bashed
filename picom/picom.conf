
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
vsync = true;
use-damage = true;

# visual
corner-radius = 14;

rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Eww'",
  "window_type = 'menu'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'"
];


# shadows
shadow = true;
shadow-radius = 20;
shadow-offset-x = -5;
shadow-offset-y = 8;
shadow-opacity = 0.35;
shadow-color = "#000000";


# window types
wintypes:
{
    menu = {
        shadow = false;
        blur-background = false;
    };

    popup_menu = {
        shadow = false;
        blur-background = false;
    };

    dropdown_menu = {
        shadow = false;
        blur-background = false;
    };

    tooltip = {
        shadow = false;
        blur-background = false;
    };
};

