backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
vsync = true;
use-damage = true;

# visual
corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Eww'"
];


shadow = true;
shadow-radius = 20;
shadow-offset-x = -5;
shadow-offset-y = 8;
shadow-opacity = 0.35;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Dunst'",
  "class_g = 'Conky'",
  "class_g ?= 'slop'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'"
];

# the fade haircut
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;
no-fading-openclose = false;


# oppo-city
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "92:class_g = 'kitty' && focused",
  "85:class_g = 'kitty' && !focused",
  "92:class_g = 'Alacritty' && focused",
  "85:class_g = 'Alacritty' && !focused",
  "100:class_g = 'firefox'",
  "100:class_g = 'mpv'",
  "100:fullscreen"
];

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'mpv'"
];

# blur
blur: {
  method = "dual_kawase";
  strength = 6;
  background = false;
  background-frame = false;
  background-fixed = false;
}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];


# other stuff (DO NOT TOUCH)
daemon = false;
dbus = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;
unredir-if-possible = false;
log-level = "warn";


wintypes: {
    tooltip = {
        fade = true;
        shadow = false;
        opacity = 0.95;
    };

    dock = {
        shadow = false;
        clip-shadow-above = true;
    };

    dnd = {
        shadow = false;
    };

    popup_menu = {
        opacity = 0.95;
    };

    dropdown_menu = {
        opacity = 0.95;
    };
};